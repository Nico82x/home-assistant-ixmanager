name: Fehler melden
description: Problem mit der iXmanager-Integration melden
body:
  - type: input
    id: versions
    attributes:
      label: Versionen
      description: Home Assistant Core und iXmanager-Version
    validations:
      required: true
  - type: input
    id: controller
    attributes:
      label: Controller-Modell
      description: Bitte keine Seriennummer oder Geräte-ID angeben.
  - type: textarea
    id: problem
    attributes:
      label: Fehlerbeschreibung
      description: Was wurde erwartet, was passiert, wie lässt es sich nachvollziehen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Bereinigte Protokollauszüge
      description: Passwörter, Tokens, Geräte-IDs, E-Mail-Adressen und Standortdaten entfernen.
      render: text
